<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Ricardo & Zafiro | ¡Nos Casamos!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Intro (Only the background photo goes here) -->
    <header class="hero-section">
        <img src="assets/01_US_Foto1.jpg" alt="Ricardo y Zafiro" class="usfoto-img">
    </header>

    <!-- The Content Block (This whole section scrolls up together) -->
    <section class="intro-section">
        
        <!-- The tear image is right at the top of the content block -->
        <img src="assets/02_1st_tear.webp" class="tear-img">
        
        <section class="main-text">
            <h2 class="serif-subtitle">¡Nos Casamos!</h2>
            <h1 class="script-title">Ricardo & Zafiro</h1>
            
            <!-- --- START MUSIC PLAYER --- -->
            <div class="music-player">
                <h4 class="player-title">Dale play a nuestra cancion</h4>
                
                <div class="progress-bar-container">
                    <span id="current-time">00:00</span>
                    <input type="range" id="seek-slider" max="100" value="0">
                    <span id="duration">00:00</span>
                </div>

                <div class="player-controls">
                    <!-- Left Icons -->
                    <span class="side-icon" id="prev-btn">
                        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </span>
                    <!-- Center Play/Pause Button -->
                    <button id="play-pause-btn">
                        <!-- Play Triangle -->
                        <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <!-- Pause Bars (Hidden by default) -->
                        <svg id="pause-icon" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <!-- Right Icons -->
                    <span class="side-icon" id="next-btn">
                        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </span>
                </div>
                
                <!-- The actual audio file (Hidden) -->
                <audio id="wedding-song" src="assets/Tennessee_Whiskey.mp3" preload="metadata"></audio>
            </div>
            <!-- --- END MUSIC PLAYER --- -->
        </section>
       
        
    </section>
    
    <!-- Link to your JS logic -->
    <script src="js/player.js"></script>
</body>
</html>
