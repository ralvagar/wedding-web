<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Ricardo & Zafiro | ¡Nos Casamos!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style_i.css">
</head>
<body class="regalos-body">

    <!-- Wrapper for the new page layout -->
    <main class="regalos-wrapper">
        
        <!-- 1. PHYSICAL IMAGE: This strictly defines the maximum height of the page -->
        <img src="assets/invitation_intro.webp" alt="Fondo Mesa de Regalos" class="regalos-bg-img">
        
        <!-- 2. ABSOLUTE OVERLAY: This sits perfectly on top of the physical image bounds -->
        <div class="regalos-content">

            <div class="regalos-buttons">
                <a href="https://ricardoyzafiro.com/invitation_sm.html" target="_blank" class="store-btn-link" aria-label="Ver invitación">
                    <img src="assets/button_env.webp" alt="Botón de Invitacion" class="store-btn-img">
                </a>
            </div>
        </div>
    </main>
<script>
    // Disable right-click
    document.addEventListener('contextmenu', event => event.preventDefault());

    // Disable common developer tools keyboard shortcuts
    document.onkeydown = function(e) {
        if (
            e.key === "F12" || 
            (e.ctrlKey && e.shiftKey && e.key === "I") || 
            (e.ctrlKey && e.shiftKey && e.key === "J") || 
            (e.ctrlKey && e.key === "U")
        ) {
            e.preventDefault();
            return false;
        }
    };
</script>
</body>
</html>
